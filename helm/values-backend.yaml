# Install with:
#   helm install runner-monitor-backend ./chart -f values-backend.yaml
#
# The Service name below (backend) is load-bearing, not cosmetic: the
# frontend's nginx.conf has "proxy_pass http://backend:3001/" baked in at
# image build time. Renaming this Service breaks /api on the frontend.
deployment:
  name: backend
  labels:
    app: github-runner-monitor-backend
  image:
    name: bialekamir/github-runner-monitor
    tag: backend-v2.1.0
  resources:
    limits:
      cpu: 400m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  readiness:
    includeReadinessProbe: true
    probePath: /health
    probePort: 3001
    scheme: HTTP
    initialDelay: 5
    period: 10
    failureThreshold: 3
    successThreshold: 1
    timeout: 3
  liveness:
    includeLivenessProbe: true
    probePath: /health
    probePort: 3001
    scheme: HTTP
    initialDelay: 10
    period: 30
    failureThreshold: 3
    successThreshold: 1
    timeout: 3
  env:
    regular:
      NODE_ENV: production
      PORT: "3001"
      USE_MOCK_DATA: "false"
      # Required when USE_MOCK_DATA is "false".
      GITHUB_ORGANIZATION: ""
      # Runner pool counts are the only thing still fetched from GitHub.
      # Job data arrives by webhook and is already in memory.
      CACHE_TTL_RUNNERS_SECONDS: "30"
      CACHE_MAX_SIZE: "100"
      # Where the job list is saved so a restart does not empty the page.
      # Leave empty and nothing is saved or read back.
      JOB_STATE_S3_BUCKET: ""
      JOB_STATE_S3_KEY: "github-runner-monitor/job-store.json"
      # Alerting. These are the deploy-time values; the Alerts dialog in the
      # UI can change them later, and a change made there is saved to the
      # same bucket as the job list (ALERT_STATE_S3_KEY) and wins over these
      # until someone presses "Reset to deployment values".
      ALERT_QUEUE_WAIT_ENABLED: "true"
      ALERT_QUEUE_WAIT_MINUTES: "15"
      ALERT_RUNNER_GROUP_OFFLINE_ENABLED: "true"
      ALERT_RUNNER_GROUP_OFFLINE_MINUTES: "10"
      # Empty means alerts are shown on screen only. A webhook URL usually
      # holds a secret: prefer putting it in the secret below (see
      # README.md#alerts in this folder) and drop this line.
      ALERT_WEBHOOK_URL: ""
      ALERT_SETTINGS_EDITABLE: "true"
      ALERT_STATE_S3_KEY: "github-runner-monitor/alert-state.json"
    # Neither of these goes in this file. Create the secret yourself first:
    #   kubectl create secret generic github-runner-monitor-token \
    #     --from-literal=token=<your-fine-grained-token> \
    #     --from-literal=webhookSecret=<the-organisation-webhook-secret>
    # See ../README.md for what the token needs and how to create the webhook.
    fromSecrets:
    - envName: GITHUB_TOKEN
      secretName: github-runner-monitor-token
      secretKey: token
    # What proves an incoming message really came from GitHub. Without it the
    # webhook route refuses every delivery.
    - envName: GITHUB_WEBHOOK_SECRET
      secretName: github-runner-monitor-token
      secretKey: webhookSecret

service:
  services:
  - name: backend
    type: ClusterIP
    enableProbePort: false
    selectDeployment: true
    ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001

# Debug it: lets a signed in user ask Claude why a failed GitHub Actions job
# failed. Off by default; with enabled false (or this block removed) the chart
# renders exactly what 1.x rendered. These values belong to the backend
# release only; a debugIt block in the frontend release renders nothing.
#
# Turning it on also needs, or rendering fails naming what is missing:
#   - deployment.env.regular.JOB_STATE_S3_BUCKET above (records live in S3)
#   - the GITHUB_WEBHOOK_SECRET entry under deployment.env.fromSecrets above
#   - deployment.autoscaling off: Debug it runs exactly one backend pod
#     (replicas 1, strategy Recreate)
#
# Secrets are never written here, only references to Kubernetes Secrets you
# create yourself. A plain string where a Secret reference belongs fails.
debugIt:
  enabled: false
  # organization: one Anthropic API key for everyone (anthropicApiKeySecret).
  # personal: each user brings their own key; anthropicApiKeySecret optional.
  credentialsMode: organization
  # Debug it runs per user per month with the organization key.
  monthlyCap: 5
  # debug-it-only: the 1.x dashboard stays open, only Debug it needs sign in.
  # whole-dashboard: every page except /health and the webhook needs sign in.
  loginScope: debug-it-only
  # GitHub numeric user IDs (not logins, which can be renamed), e.g.
  # 1000001. At least one is required when enabled.
  administrators: []
  # Starting lists; administrators change them later in the UI.
  # Repositories as owner/name, e.g. acme/payments-api; users as GitHub
  # numeric user IDs.
  allowedRepositories: []
  allowedUsers: []
  # The address users open the dashboard on, e.g. https://runner-monitor.acme.example
  # Required when enabled; sign in returns here.
  publicUrl: ""
  # The Debug it GitHub App (separate from GITHUB_TOKEN above).
  githubApp:
    appId: ""
    clientId: ""
    # Secret holding the App's private key (PEM).
    privateKeySecret:
      name: ""
      key: ""
    # Secret holding the App's OAuth client secret.
    clientSecretSecret:
      name: ""
      key: ""
  # Secret holding two 32 byte keys, personalKeyEncryptionKey and
  # sessionEncryptionKey. Required when enabled.
  encryptionSecret:
    name: ""
  # Secret holding the organization Anthropic API key. Required in
  # organization mode.
  anthropicApiKeySecret:
    name: ""
    key: ""
  # Namespace the Debug Jobs run in. Create it yourself first; the chart
  # renders the backend's Role, RoleBinding and a NetworkPolicy into it.
  debugNamespace: debug-it
  # The Debug Job image (code/debug-job). repository is required when
  # enabled, without a tag, e.g. bialekamir/github-runner-monitor.
  jobImage:
    repository: ""
    # empty = debug-job-v<chart appVersion>, the Debug Job image of the same
    # release as the backend. Quote a numeric tag ("1.10"), or YAML reads it
    # as a number (1.1).
    tag: ""
  # Port the Debug Job posts its result to on the backend Service.
  resultsPort: 3002
  # Network rules around the Debug Job and the backend. Check these match
  # your cluster: Debug Jobs reach only Anthropic, cluster DNS and the
  # backend results port; the backend main port (3001) is reachable only from
  # the frontend pods and the ingress controller pods.
  network:
    # Anthropic API addresses (https://docs.anthropic.com/en/api/ip-addresses).
    anthropicCidrs:
    - 160.79.104.0/23
    - "2607:6bc0::/48"
    # Where the cluster DNS pods run, and their labels.
    dnsNamespace: kube-system
    dnsPodLabels:
      k8s-app: kube-dns
    # Labels of the frontend pods (in this release's namespace).
    frontendPodLabels:
      app: github-runner-monitor-frontend
    # Where the ingress controller pods run, and their labels.
    ingressControllerNamespace: ingress-nginx
    ingressControllerPodLabels:
      app.kubernetes.io/name: ingress-nginx
  limits:
    maxConcurrentRuns: 3
    maxRunsPerUser: 1
    timeLimitMinutes: 15
    spendLimitUsd: 2
    logLimitBytes: 2097152
    patchLimitBytes: 102400
    # 0 means no organization spend limit.
    organizationMonthlySpendLimitUsd: 0
  # Story 6.1: report each finished debug run's cost and tokens to the OTLP
  # collector of the claude-code-reviewer-cost Grafana dashboard (see the
  # README, "Cost telemetry"). The backend POSTs to {endpoint}/v1/metrics,
  # for example http://otel-collector.monitoring:4318. The collector key, if
  # the collector needs one, only as a Secret reference { name, key }; it is
  # sent as the x-api-key header.
  costTelemetry:
    enabled: false
    endpoint: ""
    apiKeySecret: {}
